<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAN PANEL AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b0f19; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        header { background: #161b2c; padding: 15px; border-bottom: 2px solid #00f2ff; display: flex; align-items: center; justify-content: center; }
        .logo { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #00f2ff; margin-right: 10px; }
        .card { background: linear-gradient(135deg, #00d2ff, #3a7bd5); padding: 20px; border-radius: 15px; margin: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .box { background: #1c2333; padding: 20px; border-radius: 12px; border: 1px solid #2d3748; }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo" class="logo">
        <h2 style="color:#00f2ff">SHAN PANEL AI</h2>
    </header>
    <div class="card">
        <h3>خوش آمدید، شان علی!</h3>
        <p>بیلنس: $150.00</p>
    </div>
    <div class="grid">
        <div class="box"><i class="fas fa-shopping-cart"></i><p>آرڈرز</p><h4>0</h4></div>
        <div class="box"><i class="fas fa-wallet"></i><p>بیلنس</p><h4>$150</h4></div>
    </div>
</body>
</html>
