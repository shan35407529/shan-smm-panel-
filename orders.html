<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Shan Ali SMM</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f1f5f9; display: flex; }
        .sidebar { width: 220px; background: #1e293b; color: white; height: 100vh; position: fixed; padding: 20px; text-align: right; }
        .main-content { margin-left: 240px; padding: 20px; width: 100%; text-align: right; }
        .nav-item { display: block; color: white; text-decoration: none; padding: 12px; border-bottom: 1px solid #334155; }
        .table-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px; border: 1px solid #cbd5e1; }
        th { background-color: #38bdf8; color: white; }
        .status { padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .completed { background: #dcfce7; color: #166534; }
        .pending { background: #fef9c3; color: #854d0e; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>شان علی SMM</h3>
    <a href="dashboard.html" class="nav-item">🏠 ڈیش بورڈ</a>
    <a href="orders.html" class="nav-item">📦 میرے آرڈرز</a>
    <a href="add-funds.html" class="nav-item">💰 فنڈز جمع کریں</a>
    <a href="login.html" class="nav-item" style="color: #f87171; margin-top: 20px;">🚪 لاگ آؤٹ</a>
</div>

<div class="main-content">
    <h2>میرے آرڈرز کی تفصیل</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>آرڈر نمبر</th>
                    <th>سروس</th>
                    <th>تعداد</th>
                    <th>حالت (Status)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>#1001</td>
                    <td>Instagram Followers</td>
                    <td>1000</td>
                    <td><span class="status completed">مکمل ہو گیا</span></td>
                </tr>
                <tr>
                    <td>#1002</td>
                    <td>TikTok Likes</td>
                    <td>500</td>
                    <td><span class="status pending">انتظار میں</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</html>
