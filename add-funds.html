<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Funds - Shan Ali SMM</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 15px; border: 2px solid #3b82f6; max-width: 400px; margin: auto; }
        .method { background: #ffffff; color: #000; padding: 12px; border-radius: 10px; margin-bottom: 15px; font-weight: bold; text-align: left; border-left: 8px solid #f59e0b; }
        .ai-form { background: #111827; border: 1px dashed #10b981; padding: 20px; border-radius: 10px; text-align: right; margin-top: 20px; }
        label { font-size: 13px; color: #10b981; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: none; background: #1e293b; color: white; box-sizing: border-box; }
        .btn-verify { background: #10b981; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; width: 100%; font-weight: bold; }
        .wa-btn { background: #25d366; color: white; padding: 12px; text-decoration: none; display: block; border-radius: 8px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>فنڈز جمع کروائیں 💰</h2>
        
        <div class="method" style="border-left-color: #f59e0b;">
            <p style="color: #f59e0b; margin: 0;">Bank: Moblink Microfinance Bank</p>
            <p style="color: #64748b; font-size: 11px; margin: 0;">(Dost App Account)</p>
            <h3 style="margin: 5px 0;">A/C: 140414921</h3>
            <small>نام: SHAN ALI</small>
        </div>

        <div class="method" style="border-left-color: #22c55e;">
            <p style="color: #22c55e; margin: 0;">EasyPaisa / JazzCash</p>
            <h3 style="margin: 5px 0;">03035407529</h3>
            <small>نام: Shan Ali Bhatti</small>
        </div>

        <div class="ai-form">
            <h4 style="color: #10b981; margin: 0; text-align: center;">🤖 پیمنٹ رپورٹ فارم</h4>
            
            <label>آپ کا نمبر اور بینک کا نام:</label>
            <input type="text" id="senderInfo" placeholder="مثلاً: 03xx - EasyPaisa">

            <label>رقم (Amount in PKR):</label>
            <input type="number" id="amount" placeholder="کتنے پیسے بھیجے؟">

            <label>ٹرانزیکشن آئی ڈی (TID):</label>
            <input type="text" id="tid" placeholder="TID نمبر لکھیں">

            <button class="btn-verify" onclick="submit()">رپورٹ جمع کریں</button>
        </div>

        <a href="https://wa.me/923107199210" target="_blank" class="wa-btn">واٹس ایپ پر رابطہ کریں 💬</a>
        <a href="dashboard.html" style="display:block; margin-top:15px; color:#94a3b8; text-decoration:none;">← واپس ڈیش بورڈ</a>
    </div>

    <script>
        function submit() {
            var id = document.getElementById("tid").value;
            if(id !== "") {
                alert("شکریہ شان علی بھائی! رپورٹ موصول ہوگئی ہے۔");
            } else {
                alert("براہ کرم آئی ڈی لکھیں!");
            }
        }
    </script>

</body>
</html>
