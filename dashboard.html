<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shan Ali SMM</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; text-align: center; margin: 0; }
        
        /* ویلکم پاپ اپ کا ڈیزائن */
        .welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; align-items: center;
            justify-content: center; z-index: 1000;
        }
        .welcome-card {
            background: #1e293b; padding: 30px; border-radius: 20px;
            border: 2px solid #3b82f6; width: 80%; max-width: 350px;
            box-shadow: 0 0 20px #3b82f6;
        }
        .welcome-card h2 { color: #3b82f6; margin-bottom: 10px; }
        .welcome-card p { font-size: 14px; line-height: 1.5; color: #cbd5e1; }
        .close-btn {
            background: #3b82f6; color: white; border: none; padding: 10px 25px;
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }

        /* ڈیش بورڈ کا باقی حصہ */
        .main-content { padding: 20px; }
    </style>
</head>
<body>

    <div class="welcome-overlay" id="welcomeBox">
        <div class="welcome-card">
            <div style="font-size: 50px;">🚀</div>
            <h2>خوش آمدید!</h2>
            <p>شان علی SMM پینل میں خوش آمدید۔ یہاں آپ کو سب سے سستی اور تیز ترین سوشل میڈیا سروسز ملیں گی۔</p>
            <button class="close-btn" onclick="closeWelcome()">چلو شروع کرتے ہیں</button>
        </div>
    </div>

    <div class="main-content">
        <h1>Shan Ali SMM Dashboard</h1>
        <p>آپ کا لنک: https://shan35407529.github.io/shan-smm-panel-/</p>
    </div>

    <script>
        // جب پیج لوڈ ہو تو پاپ اپ دکھائیں
        window.onload = function() {
            document.getElementById("welcomeBox").style.display = "flex";
        };

        // بٹن دبانے پر پاپ اپ غائب کر دیں
        function closeWelcome() {
            document.getElementById("welcomeBox").style.display = "none";
        }
    </script>

</body>
</html>
