<select id="service_id">
    <option value="5341">YouTube Views (ID: 5341)</option>
    <option value="5342">YouTube Suggested Views (ID: 5342)</option>
    </select>

<input type="text" id="order_link" placeholder="لنک یہاں ڈالیں (Link)">
<input type="number" id="order_qty" placeholder="تعداد (Quantity)">

<button onclick="placeRealOrder()" class="order-btn">آرڈر لگائیں (Order Now)</button>

<script>
function placeRealOrder() {
    const key = "6800c815522f9b020c9b3ab0efeb8e20";
    const service = document.getElementById('service_id').value;
    const link = document.getElementById('order_link').value;
    const qty = document.getElementById('order_qty').value;

    if(!link || !qty) {
        alert("لنک اور تعداد لکھنا ضروری ہے!");
        return;
    }

    // یہ کوڈ SMMGlobe کو آرڈر بھیجے گا
    fetch(`https://smmglobe.com/api/v2?key=${key}&action=add&service=${service}&link=${link}&quantity=${qty}`)
    .then(res => res.json())
    .then(data => {
        if(data.order) {
            alert("مبارک ہو! اصلی آرڈر لگ گیا ہے چاچو! آئی ڈی ہے: " + data.order);
        } else {
            alert("آرڈر نہیں لگا: " + data.error);
        }
    })
    .catch(err => alert("کچھ مسئلہ ہے، شاید نیٹ کا یا بیلنس کا!"));
}
</script>
