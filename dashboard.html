<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shan Ali SMM</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; margin: 0; padding: 15px; }
        .header { background: #1e293b; padding: 20px; border-radius: 10px; text-align: center; border-bottom: 3px solid #3b82f6; }
        .balance-box { background: #3b82f6; padding: 15px; border-radius: 10px; margin-top: 15px; font-weight: bold; }
        .order-form { background: #1e293b; padding: 20px; border-radius: 10px; margin-top: 20px; }
        select, input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; box-sizing: border-box; }
        button { background: #10b981; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        .nav-links { display: flex; justify-content: space-around; margin-top: 20px; background: #1e293b; padding: 10px; border-radius: 10px; }
        .nav-links a { color: #3b82f6; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Shan Ali SMM Panel 🚀</h2>
        <p>خوش آمدید، اپنا آرڈر لگائیں</p>
    </div>

    <div class="balance-box">
        میرا بیلنس: Rs. 0.00
    </div>

    <div class="order-form">
        <h3>نیا آرڈر (New Order)</h3>
        
        <label>سروس منتخب کریں:</label>
        <select>
            <option>Instagram Followers - Rs. 150/1k</option>
            <option>TikTok Likes - Rs. 100/1k</option>
            <option>YouTube Watchtime - Rs. 2000/1k</option>
            <option>Facebook Page Likes - Rs. 300/1k</option>
        </select>

        <label>لنک (Link):</label>
        <input type="text" placeholder="https://www.instagram.com/profile">

        <label>مقدار (Quantity):</label>
        <input type="number" placeholder="مثلاً 1000">

        <button onclick="alert('آرڈر موصول ہو گیا ہے! ایڈمن جلد پروسیس کرے گا۔')">آرڈر لگائیں (Place Order)</button>
    </div>

    <div class="nav-links">
        <a href="add-funds.html">پیسے جمع کریں 💰</a>
        <a href="orders.html">میرے آرڈرز 📦</a>
        <a href="index.html" style="color: #ef4444;">لاگ آؤٹ 🚪</a>
    </div>

</body>
</html>
