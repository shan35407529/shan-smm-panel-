<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control - Shan Ali SMM</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; margin: 0; padding: 20px; text-align: center; }
        .admin-content { display: none; } /* شروع میں سب چھپا ہوگا */
        .login-box { background: #1e293b; padding: 30px; border-radius: 10px; display: inline-block; margin-top: 100px; border: 1px solid #3b82f6; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        .stat-card { background: #3b82f6; padding: 20px; border-radius: 10px; margin: 10px; display: inline-block; width: 150px; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-box">
        <h2>ایڈمن لاگ ان 🔐</h2>
        <input type="password" id="admin-pass" placeholder="پاس ورڈ درج کریں">
        <button onclick="checkPass()">داخل ہوں</button>
        <p id="error" style="color: red; display: none;">غلط پاس ورڈ!</p>
    </div>

    <div id="admin-panel" class="admin-content">
        <h1>خوش آمدید شان علی بھائی! 👑</h1>
        <div class="stat-card">کل صارفین<br> 25</div>
        <div class="stat-card">کل آرڈرز<br> 142</div>
        
        <div style="background: #1e293b; padding: 20px; border-radius: 10px; margin-top: 20px; max-width: 400px; margin-left: auto; margin-right: auto;">
            <h3>بیلنس ایڈ کریں</h3>
            <input type="text" placeholder="User Name">
            <input type="number" placeholder="Amount">
            <button style="background: #10b981;">پیسے جمع کریں</button>
        </div>
        <br>
        <a href="dashboard.html" style="color: #94a3b8; text-decoration: none;">← واپس ڈیش بورڈ</a>
    </div>

    <script>
        function checkPass() {
            var pass = document.getElementById("admin-pass").value;
            // یہاں آپ اپنا مرضی کا پاس ورڈ رکھ سکتے ہیں، ابھی میں نے 'shan123' رکھا ہے
            if (pass === "shan123") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("admin-panel").style.display = "block";
            } else {
                document.getElementById("error").style.display = "block";
            }
        }
    </script>
</body>
</html>
