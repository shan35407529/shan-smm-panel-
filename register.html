<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رجسٹر - شان پینل</title>
    <style>
        body { background: #0b1120; color: white; font-family: sans-serif; text-align: center; padding: 20px; direction: rtl; }
        .form-box { background: #1a2236; padding: 25px; border-radius: 15px; border: 1px solid #00e5ff; max-width: 400px; margin: auto; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #fff; color: #000; }
        .reg-btn { background: #00e5ff; color: #000; font-weight: bold; width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <h2 style="color: #00e5ff;">نیا اکاؤنٹ بنائیں</h2>
    <p>اپنا ڈیٹا بالکل صحیح لکھیں</p>

    <div class="form-box">
        <form action="https://formspree.io/f/YOUR_ID_HERE" method="POST">
            
            <input type="text" name="Name" placeholder="آپ کا پورا نام" required>
            
            <input type="email" name="Email" placeholder="ای میل ایڈریس" required>
            
            <input type="tel" name="Mobile" placeholder="موبائل نمبر (03xxxxxxxxx)" required>
            
            <input type="password" name="Password" placeholder="پاس ورڈ بنائیں" required>
            
            <button type="submit" class="reg-btn">رجسٹر کریں</button>
        </form>
        
        <p style="margin-top: 15px;">پہلے سے اکاؤنٹ ہے؟ <a href="login.html" style="color: #00e5ff;">لاگ ان کریں</a></p>
    </div>

</body>
</html>
