<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لاگ ان - Shan Ali SMM</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; text-align: center; padding: 40px; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 15px; display: inline-block; border: 1px solid #3b82f6; width: 300px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        a { color: #94a3b8; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>لاگ ان 🔑</h2>
        <p style="font-size: 13px; color: #94a3b8;">اپنا اکاؤنٹ لاگ ان کریں</p>
        
        <input type="email" id="userEmail" placeholder="ای میل لکھیں" required>
        <input type="password" id="userPass" placeholder="پاس ورڈ لکھیں" required>
        
        <button onclick="handleLogin()">داخل ہوں</button>
        
        <br><br>
        <a href="register.html">نیا اکاؤنٹ بنائیں؟</a>
    </div>

    <script>
        function handleLogin() {
            var email = document.getElementById("userEmail").value;
            var pass = document.getElementById("userPass").value;

            // --- ایڈمن (آپ) کے لیے مخصوص معلومات ---
            // یہاں آپ اپنی مرضی کا ای میل اور پاس ورڈ رکھ سکتے ہیں
            if (email === "shanali@admin.com" && pass === "shan786") {
                alert("خوش آمدید شان بھائی! آپ ایڈمن کے طور پر لاگ ان ہو رہے ہیں۔");
                window.location.href = "admin.html"; // یہ آپ کو ایڈمن پینل پر لے جائے گا
            } 
            // --- عام گاہکوں کے لیے ---
            else if (email !== "" && pass !== "") {
                alert("لاگ ان کامیاب!");
                window.location.href = "dashboard.html"; // یہ گاہک کو ڈیش بورڈ پر لے جائے گا
            } 
            else {
                alert("براہ کرم صحیح ای میل اور پاس ورڈ لکھیں!");
            }
        }
    </script>

</body>
</html>
