<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shan Ali SMM</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; text-align: center; padding-top: 50px; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 15px; border: 1px solid #3b82f6; width: 80%; max-width: 320px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #0f172a; color: white; box-sizing: border-box; }
        .login-btn { width: 100%; padding: 12px; background: #3b82f6; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>لاگ ان 🔑</h2>
        <input type="text" id="user" placeholder="ای میل یا یوزرنیم">
        <input type="password" id="pass" placeholder="پاس ورڈ">
        <button class="login-btn" onclick="startLogin()">داخل ہوں</button>
    </div>

    <script>
        function startLogin() {
            // یہ لائن آپ کو پکا ڈیش بورڈ پر لے جائے گی
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
